<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضمام - FamilySphere</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }
        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
            font-size: 1.6rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: bold;
            font-size: 0.95rem;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #2563eb;
        }
        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>انضمام إلى FamilySphere</h2>
    
    <!-- تم دمج رابط Formcarry الخاص بك هنا -->
    <form action="https://formcarry.com/s/I6VYX8ZkSKb" method="POST">
        
        <div class="form-group">
            <label for="fullname">الاسم الكامل</label>
            <input type="text" id="fullname" name="الاسم_الكامل" placeholder="أدخل اسمك الثلاثي" required>
        </div>

        <div class="form-group">
            <label for="email">البريد الإلكتروني الآمن</label>
            <input type="email" id="email" name="البريد_الالكتروني" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="category">صلة القرابة / الفئة</label>
            <select id="category" name="الفئة" required>
                <option value="" disabled selected>اختر الفئة...</option>
                <option value="مؤسس / إداري">مؤسس / إداري</option>
                <option value="عضو عائلي">عضو عائلي</option>
                <option value="مستكشف / زائر">مستكشف / زائر</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">إرسال طلب الانضمام</button>
    </form>
</div>

</body>
</html>
