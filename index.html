<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilySphere - منصة العائلة العالمية</title>
    
    <!-- Open Graph Tags لمعاينة السوشيال ميديا -->
    <meta property="og:title" content="FamilySphere - منصة العائلة العالمية">
    <meta property="og:description" content="منظومة رقمية مستقلة ومطورة لإدارة البيانات والتواصل الفعال. انضم الآن!">
    <meta property="og:type" content="website">

    <!-- ربط ملف PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            margin: auto;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        p {
            color: #4b5563;
            margin-bottom: 25px;
            font-size: 1rem;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #2563eb;
        }
        .btn-submit {
            width: 100%;
            background-color: #16a34a;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #15803d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>FamilySphere</h1>
        <p>منصة العائلة العالمية<br>النظام نشط وجاهز لاستقبال الزوار وتتبع الأداء.</p>
        
        <!-- نموذج التسجيل المدمج مباشرة في الصفحة -->
        <form action="https://formcarry.com/s/I6VYX8ZkSKb" method="POST">
            
            <div class="form-group">
                <label for="fullname">الاسم الكامل</label>
                <input type="text" id="fullname" name="الاسم_الكامل" placeholder="أدخل اسمك الثلاثي" required>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني الآمن</label>
                <input type="email" id="email" name="البريد_الالكتروني" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="category">صلة القرابة / الفئة</label>
                <select id="category" name="الفئة" required>
                    <option value="" disabled selected>اختر الفئة...</option>
                    <option value="مؤسس / إداري">مؤسس / إداري</option>
                    <option value="عضو عائلي">عضو عائلي</option>
                    <option value="مستكشف / زائر">مستكشف / زائر</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">إرسال طلب الانضمام</button>
        </form>
    </div>
</div>

</body>
</html>
